name: Debug autoreconf

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libtool-bin pkg-config gettext

      - name: 定位 libffi configure.ac 第 215 行
        run: |
          set -x
          cd /tmp
          for V in 3.4.4 3.4.6; do
            echo "########## libffi $V ##########"
            curl -sSL "https://github.com/libffi/libffi/releases/download/v$V/libffi-$V.tar.gz" -o "libffi-$V.tgz"
            ls -l "libffi-$V.tgz"
            tar -xzf "libffi-$V.tgz"
            echo "--- configure.ac 205..225 ---"
            sed -n '205,225p' "libffi-$V/configure.ac"
            echo "--- 该行提到的宏是否在 aclocal 宏里 ---"
            grep -rn "LT_SYS_SYMBOL_USCORE" "libffi-$V" | head -5 || true
            grep -rn "LT_SYS_SYMBOL_USCORE" /usr/share/aclocal/ | head -5 || true
          done

      - name: 试各种 autoreconf 方式,看哪种能过
        run: |
          cd /tmp/libffi-3.4.4
          echo "===== libffi 自带 m4 目录内容 ====="
          ls -l m4/ 2>/dev/null | head -20 || echo "(没有 m4 目录)"
          grep -c "LT_SYS_SYMBOL_USCORE" m4/*.m4 2>/dev/null || true

          echo
          echo "===== 方案 D: aclocal -I m4 优先于系统宏 ====="
          cd /tmp && rm -rf libffi-d && cp -r libffi-3.4.4 libffi-d && cd libffi-d
          libtoolize --force --copy >/dev/null 2>&1
          aclocal -I m4 2>&1 | tail -3
          echo -n "生成后的 aclocal.m4 里有没有这个宏: "
          grep -c "AC_DEFUN(\[LT_SYS_SYMBOL_USCORE\]" aclocal.m4 || echo 0
          autoconf 2>&1 | tail -8 && echo ">>> 方案 D: autoconf 通过 ✅" || echo ">>> 方案 D: 失败"

          echo
          echo "===== 方案 E: 只改 aclocal 的搜索顺序(把 libffi 的 m4 放最前) ====="
          cd /tmp && rm -rf libffi-e && cp -r libffi-3.4.4 libffi-e && cd libffi-e
          ACLOCAL_PATH="$PWD/m4" autoreconf -vfi 2>&1 | tail -12 && echo ">>> 方案 E: autoreconf 通过 ✅" || echo ">>> 方案 E: 失败"

