name: Build Android APK

# Builds a native arm64 Android APK with buildozer + python-for-android.
# Trigger manually from the Actions tab, or push a v* tag.
# Artifact: Tarkov2D-apk (contains bin/*.apk).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool \
            libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev gettext

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.1"

      # Ubuntu libtool 2.4.7 lacks LT_SYS_SYMBOL_USCORE which some autotools
      # recipes regenerate. Those tarballs ship a working configure already,
      # so skip autoreconf whenever one is present.
      - name: Patch autoreconf
        run: |
          mkdir -p "$HOME/.binshim"
          cat > "$HOME/.binshim/autoreconf" <<'EOF'
          #!/bin/bash
          for a in "$@"; do
            case "$a" in
              -*) ;;
              *) if [ -f "$a/configure" ]; then
                   echo "[shim] skip autoreconf for $a"
                   exit 0
                 fi ;;
            esac
          done
          if [ -f ./configure ]; then
            echo "[shim] skip autoreconf in $PWD"
            exit 0
          fi
          exec /usr/bin/autoreconf "$@"
          EOF
          chmod +x "$HOME/.binshim/autoreconf"
          echo "$HOME/.binshim" >> "$GITHUB_PATH"

      # Toolchain cache (SDK/NDK + p4a dists).
      #
      # The key used to include hashFiles('buildozer.spec'), so every version
      # bump changed the key, missed the cache and rebuilt the whole toolchain
      # (~60 min instead of ~10). The toolchain only depends on the pinned
      # requirements/NDK lines, which change rarely, so use a stable key and
      # keep the old prefix in restore-keys to warm the first build after this
      # change.
      - name: Cache SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-Linux-toolchain-v1
          restore-keys: |
            buildozer-Linux-

      # Warmup: builds the toolchain and hostpython3. It is expected to fail
      # later on (at pygame) during the first pass.
      - name: Warmup (build hostpython3)
        continue-on-error: true
        timeout-minutes: 70
        run: buildozer -v android debug

      # p4a runs pygame setup.py with its own hostpython3, so Cython has to be
      # installed there and not in the runner system python.
      - name: Install Cython into hostpython3 and build
        run: |
          HP="$PWD/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3/desktop/hostpython3/native-build/root/usr/local/bin/python3"
          if [ ! -x "$HP" ]; then
            HP=$(find "$HOME/.buildozer" "$PWD/.buildozer" -type f -path "*hostpython3*" -name "python3*" 2>/dev/null | head -1)
          fi
          echo "hostpython3: $HP"
          test -x "$HP" || { echo "!! hostpython3 not built by warmup"; exit 1; }
          "$HP" -m pip install -q "cython<3.1" wheel setuptools
          "$HP" -c "import Cython; print('Cython', Cython.__version__)"
          buildozer -v android debug

      - name: Show artifacts
        run: ls -lh bin/ || true

      # Every library in the APK must be loadable on the phone.
      #
      # Android's linker resolves all relocations at dlopen() time, so ONE
      # undefined symbol makes a whole module unloadable and the app dies at
      # launch with no error dialog.  1.0.8 shipped exactly that: pygame's
      # surface.so referenced pg_avx2_at_runtime_but_uncompiled, which nothing
      # defined.  The previous check here hard-coded two symbol names and only
      # looked at surface.so, so it walked straight past it - this one is
      # generic and looks at every .so, including the ones packed inside
      # libpybundle.so, and it also verifies the architecture.
      - name: Verify every library in the APK is loadable
        run: |
          APK=$(ls bin/*.apk 2>/dev/null | head -1)
          test -n "$APK" || { echo "!! no APK produced"; exit 1; }
          echo "checking $APK"
          python tools/check_android_symbols.py "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarkov2D-apk
          path: |
            bin/*.apk
            bin/**/*.apk
          if-no-files-found: error
