name: Build Android APK

# 用法:把项目推到 GitHub → 仓库 Actions 页面点 "Run workflow"
# 构建完成后在 Artifacts 里下载 Tarkov2D-apk(zip,里面是 apk,传到手机安装即可)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool \
            libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev gettext
          echo "===== 校验 libffi 配方要求的宏是否就位 ====="
          echo -n "LT_SYS_SYMBOL_USCORE 出现次数: "
          grep -c "LT_SYS_SYMBOL_USCORE" /usr/share/aclocal/libtool.m4 /usr/share/aclocal/ltdl.m4 2>/dev/null | tr '\n' ' '
          echo

      - name: 安装 buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.1"

      # Ubuntu 的 libtool 2.4.7 里没有 LT_SYS_SYMBOL_USCORE 宏(老 libtool 才有),
      # 而 libffi 的 configure.ac 要用它 —— 一旦 autoreconf 重新生成 aclocal.m4 就报
      # "possibly undefined macro: LT_SYS_SYMBOL_USCORE" 直接中断构建。
      # 这些包自带的 configure 本来就是完整可用的,所以有 configure 就跳过 autoreconf。
      - name: 修补 autoreconf(绕开 libtool 老宏缺失)
        run: |
          mkdir -p "$HOME/.binshim"
          cat > "$HOME/.binshim/autoreconf" <<'EOF'
          #!/bin/bash
          for a in "$@"; do
            case "$a" in
              -*) ;;
              *) if [ -f "$a/configure" ]; then
                   echo "[shim] skip autoreconf for $a (pre-generated configure exists)"
                   exit 0
                 fi ;;
            esac
          done
          if [ -f ./configure ]; then
            echo "[shim] skip autoreconf in $PWD (pre-generated configure exists)"
            exit 0
          fi
          echo "[shim] pass-through to real autoreconf"
          exec /usr/bin/autoreconf "$@"
          EOF
          chmod +x "$HOME/.binshim/autoreconf"
          "$HOME/.binshim/autoreconf" --help || true
          echo "$HOME/.binshim" >> "$GITHUB_PATH"

      - name: 缓存 SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: 构建 APK
        run: |
          # pygame 的 setup.py 由 p4a 自带的 hostpython3 执行,系统 Python 里装 Cython 没用
          # (报错: "You need cython"),且 p4a 会检查 `python3 -m cython --help`。
          # 1) 预热:先建出 NDK/SDK 与 hostpython3(会在 pygame 处停下,用 || true 兜住)
          buildozer -v android buildozer.spec >/dev/null 2>&1 || true
          # 2) 把 Cython 装进「那个」hostpython3(精确路径,见上轮构建日志)
          HP=/home/runner/work/Tarkov2D/Tarkov2D/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3/desktop/hostpython3/native-build/root/usr/local/bin/python3
          if [ ! -x "$HP" ]; then
            HP=$(find "$PWD/.buildozer" -type f -path "*hostpython3*" -name python3 2>/dev/null | head -1)
          fi
          echo "hostpython3 解释器: $HP"
          # 3) 安装 + 校验(import 能过 + p4a 用的 `-m cython` 也能过)
          "$HP" -m pip install -q "cython<3.1" wheel setuptools
          "$HP" -c "import Cython; print('Cython', Cython.__version__)"
          "$HP" -m cython --help >/dev/null && echo "OK: hostpython3 已具备 Cython"
          # 4) 正式构建(复用已建好的 hostpython3)
          buildozer -v android debug

      - name: 显示产物
        run: ls -lh bin/ || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarkov2D-apk
          path: |
            bin/*.apk
            bin/**/*.apk
          if-no-files-found: error
