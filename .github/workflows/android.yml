name: Build Android APK

# Builds a native arm64 Android APK with buildozer + python-for-android.
# Trigger manually from the Actions tab, or push a v* tag.
# Artifact: Tarkov2D-apk (contains bin/*.apk).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool \
            libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev gettext

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.1"

      # Ubuntu libtool 2.4.7 lacks LT_SYS_SYMBOL_USCORE which some autotools
      # recipes regenerate. Those tarballs ship a working configure already,
      # so skip autoreconf whenever one is present.
      - name: Patch autoreconf
        run: |
          mkdir -p "$HOME/.binshim"
          cat > "$HOME/.binshim/autoreconf" <<'EOF'
          #!/bin/bash
          for a in "$@"; do
            case "$a" in
              -*) ;;
              *) if [ -f "$a/configure" ]; then
                   echo "[shim] skip autoreconf for $a"
                   exit 0
                 fi ;;
            esac
          done
          if [ -f ./configure ]; then
            echo "[shim] skip autoreconf in $PWD"
            exit 0
          fi
          exec /usr/bin/autoreconf "$@"
          EOF
          chmod +x "$HOME/.binshim/autoreconf"
          echo "$HOME/.binshim" >> "$GITHUB_PATH"

      - name: Cache SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      # Warmup: builds the toolchain and hostpython3. It is expected to fail
      # later on (at pygame) during the first pass.
      - name: Warmup (build hostpython3)
        continue-on-error: true
        timeout-minutes: 70
        run: buildozer -v android debug

      # p4a runs pygame setup.py with its own hostpython3, so Cython has to be
      # installed there and not in the runner system python.
      - name: Install Cython into hostpython3 and build
        run: |
          HP="$PWD/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3/desktop/hostpython3/native-build/root/usr/local/bin/python3"
          if [ ! -x "$HP" ]; then
            HP=$(find "$HOME/.buildozer" "$PWD/.buildozer" -type f -path "*hostpython3*" -name "python3*" 2>/dev/null | head -1)
          fi
          echo "hostpython3: $HP"
          test -x "$HP" || { echo "!! hostpython3 not built by warmup"; exit 1; }
          "$HP" -m pip install -q "cython<3.1" wheel setuptools
          "$HP" -c "import Cython; print('Cython', Cython.__version__)"
          buildozer -v android debug

      - name: Show artifacts
        run: ls -lh bin/ || true

      # Self-check: this build exists because surface.so used to reference
      # undefined aarch64 symbols. Verify them here instead of on the phone.
      - name: Verify surface.so symbols and arch
        run: |
          SO=$(find "$PWD/.buildozer" -path "*dists*" -name "surface.so" 2>/dev/null | head -1)
          [ -z "$SO" ] && SO=$(find "$PWD/.buildozer" -name "surface*.so" 2>/dev/null | head -1)
          echo "surface.so: $SO"
          if [ -z "$SO" ]; then echo "!! surface.so not found, skipping"; exit 0; fi
          echo "--- arch (must be ARM aarch64, not x86_64) ---"
          file "$SO" || true
          echo "--- alphablit_alpha_sse2_argb_surf_alpha (must be T) ---"
          nm -D "$SO" 2>/dev/null | grep alphablit || true
          if nm -D "$SO" 2>/dev/null | grep -q "alphablit_alpha_sse2_argb_surf_alpha"; then
            if nm -D "$SO" 2>/dev/null | grep "alphablit_alpha_sse2_argb_surf_alpha" | grep -q " T "; then
              echo ">>> OK: symbol is DEFINED (T)"
            else
              echo ">>> BAD: symbol present but still undefined (U)"
            fi
          else
            echo ">>> WARN: symbol absent from dynamic table"
          fi
          echo "--- pg_has_avx2 (must be ABSENT on arm64) ---"
          if nm -D "$SO" 2>/dev/null | grep -q "pg_has_avx2"; then
            echo ">>> BAD: pg_has_avx2 still referenced, dlopen will fail on phone"
            nm -D "$SO" 2>/dev/null | grep "pg_has_avx2"
          else
            echo ">>> OK: pg_has_avx2 not referenced"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarkov2D-apk
          path: |
            bin/*.apk
            bin/**/*.apk
          if-no-files-found: error