name: Build Android APK

# 用法:把项目推到 GitHub → 仓库 Actions 页面点 "Run workflow"
# 构建完成后在 Artifacts 里下载 Tarkov2D-apk(zip,里面是 apk,传到手机安装即可)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool \
            libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev gettext
          echo "===== 校验 libffi 配方要求的宏是否就位 ====="
          echo -n "LT_SYS_SYMBOL_USCORE 出现次数: "
          grep -c "LT_SYS_SYMBOL_USCORE" /usr/share/aclocal/libtool.m4 /usr/share/aclocal/ltdl.m4 2>/dev/null | tr '\n' ' '
          echo

      - name: 安装 buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.1"

      # Ubuntu 的 libtool 2.4.7 里没有 LT_SYS_SYMBOL_USCORE 宏(老 libtool 才有),
      # 而 libffi 的 configure.ac 要用它 —— 一旦 autoreconf 重新生成 aclocal.m4 就报
      # "possibly undefined macro: LT_SYS_SYMBOL_USCORE" 直接中断构建。
      # 这些包自带的 configure 本来就是完整可用的,所以有 configure 就跳过 autoreconf。
      - name: 修补 autoreconf(绕开 libtool 老宏缺失)
        run: |
          mkdir -p "$HOME/.binshim"
          cat > "$HOME/.binshim/autoreconf" <<'EOF'
          #!/bin/bash
          for a in "$@"; do
            case "$a" in
              -*) ;;
              *) if [ -f "$a/configure" ]; then
                   echo "[shim] skip autoreconf for $a (pre-generated configure exists)"
                   exit 0
                 fi ;;
            esac
          done
          if [ -f ./configure ]; then
            echo "[shim] skip autoreconf in $PWD (pre-generated configure exists)"
            exit 0
          fi
          echo "[shim] pass-through to real autoreconf"
          exec /usr/bin/autoreconf "$@"
          EOF
          chmod +x "$HOME/.binshim/autoreconf"
          "$HOME/.binshim/autoreconf" --help || true
          echo "$HOME/.binshim" >> "$GITHUB_PATH"

      - name: 缓存 SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      # 第一趟:把工具链和 hostpython3 建出来(会在 pygame 处失败,continue-on-error 兜住)
      - name: 预热(建 hostpython3)
        continue-on-error: true
        timeout-minutes: 70
        run: buildozer -v android debug

      # 第二趟:把 Cython 装进 hostpython3 再正式构建
      - name: 装 Cython 并构建
        run: |
          HP="$PWD/.buildozer/android/platform/build-arm64-v8a/build/other_builds/hostpython3/desktop/hostpython3/native-build/root/usr/local/bin/python3"
          if [ ! -x "$HP" ]; then
            HP=$(find "$HOME/.buildozer" "$PWD/.buildozer" -type f -path "*hostpython3*" -name "python3*" 2>/dev/null | head -1)
          fi
          echo "hostpython3: $HP"
          test -x "$HP" || { echo "!! hostpython3 不存在,预热没建出来"; exit 1; }
          "$HP" -m pip install -q "cython<3.1" wheel setuptools
          "$HP" -c "import Cython; print('Cython', Cython.__version__)"
          buildozer -v android debug

      - name: 显示产物
        run: ls -lh bin/ || true

      # Self-check: the whole reason this build exists is that surface.so used to
      # reference an undefined arm64 symbol. Verify it here instead of finding
      # out on the phone.
      - name: 校验 surface.so 的符号与架构
        run: |
          SO=$(find "$PWD/.buildozer" -path "*dists*" -name "surface.so" 2>/dev/null | head -1)
          if [ -z "$SO" ]; then
            SO=$(find "$PWD/.buildozer" -name "surface*.so" 2>/dev/null | head -1)
          fi
          echo "surface.so: $SO"
          if [ -z "$SO" ]; then echo "!! 没找到 surface.so,跳过校验"; exit 0; fi
          echo "--- 架构 ---"
          file "$SO" || true
          echo "--- 符号 alphablit_alpha_sse2_argb_surf_alpha ---"
          nm -D "$SO" 2>/dev/null | grep -i alphablit || echo "(nm -D 无输出,试符号表)"
          nm "$SO" 2>/dev/null | grep -i "alphablit_alpha_sse2_argb_surf_alpha" || true
          if nm -D "$SO" 2>/dev/null | grep -q "alphablit_alpha_sse2_argb_surf_alpha"; then
            echo ">>> 符号已定义 ✅ (T = defined text symbol)"
          elif nm -D "$SO" 2>/dev/null | grep -q "alphablit_alpha_sse2_argb_surf_alpha"; then
            echo ">>> 符号仍是 U(未定义) ❌"
          else
            echo ">>> 该符号既未定义也不在动态表(可能已被静态解析) ⚠️"
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarkov2D-apk
          path: |
            bin/*.apk
            bin/**/*.apk
          if-no-files-found: error
