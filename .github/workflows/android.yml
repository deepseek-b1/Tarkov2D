name: Build Android APK

# 用法:把项目推到 GitHub → 仓库 Actions 页面点 "Run workflow"
# 构建完成后在 Artifacts 里下载 Tarkov2D-apk(zip,里面是 apk,传到手机安装即可)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev

      - name: 安装 buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: 缓存 SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: 构建 APK
        run: buildozer -v android debug

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarkov2D-apk
          path: bin/*.apk
          if-no-files-found: error
