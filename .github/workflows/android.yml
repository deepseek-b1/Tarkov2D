name: Build Android APK

# 用法:把项目推到 GitHub → 仓库 Actions 页面点 "Run workflow"
# 构建完成后在 Artifacts 里下载 Tarkov2D-apk(zip,里面是 apk,传到手机安装即可)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool \
            libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev gettext

      - name: 安装 buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.1"

      # Ubuntu 的 libtool 2.4.7 里没有 LT_SYS_SYMBOL_USCORE 宏(老 libtool 才有),
      # 而 libffi 的 configure.ac 要用它 —— 一旦 autoreconf 重新生成 aclocal.m4 就报
      # "possibly undefined macro: LT_SYS_SYMBOL_USCORE" 直接中断构建。
      # 这些包自带的 configure 本来就是完整可用的,所以有 configure 就跳过 autoreconf。
      - name: 修补 autoreconf(绕开 libtool 老宏缺失)
        run: |
          mkdir -p "$HOME/.binshim"
          cat > "$HOME/.binshim/autoreconf" <<'EOF'
          #!/bin/bash
          for a in "$@"; do
            case "$a" in
              -*) ;;
              *) if [ -f "$a/configure" ]; then
                   echo "[shim] skip autoreconf for $a (pre-generated configure exists)"
                   exit 0
                 fi ;;
            esac
          done
          if [ -f ./configure ]; then
            echo "[shim] skip autoreconf in $PWD (pre-generated configure exists)"
            exit 0
          fi
          echo "[shim] pass-through to real autoreconf"
          exec /usr/bin/autoreconf "$@"
          EOF
          chmod +x "$HOME/.binshim/autoreconf"
          "$HOME/.binshim/autoreconf" --help || true
          echo "$HOME/.binshim" >> "$GITHUB_PATH"

      - name: 缓存 SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: 构建 APK
        run: buildozer -v android debug

      - name: 显示产物
        run: ls -lh bin/ || true

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: Tarkov2D-apk
          path: |
            bin/*.apk
            bin/**/*.apk
          if-no-files-found: error
