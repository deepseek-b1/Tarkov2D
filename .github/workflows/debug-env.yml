name: Debug build env

on:
  workflow_dispatch:

jobs:
  env:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool \
            libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev gettext

      - name: 环境自检
        run: |
          echo "===== 系统 ====="
          lsb_release -a
          echo "===== autotools 版本 ====="
          autoconf --version | head -1
          libtoolize --version | head -1
          echo "===== 关键:libtool.m4 里有没有 LT_SYS_SYMBOL_USCORE ====="
          ls -l /usr/share/aclocal/libtool.m4
          echo -n "匹配行数: "
          grep -c "LT_SYS_SYMBOL_USCORE" /usr/share/aclocal/libtool.m4 || echo 0
          echo "===== libffi configure.ac 那一行 ====="
          curl -sL https://github.com/libffi/libffi/releases/download/v3.4.4/libffi-3.4.4.tar.gz -o /tmp/libffi.tgz && \
            tar -xzf /tmp/libffi.tgz -C /tmp && sed -n '210,220p' /tmp/libffi-3.4.4/configure.ac
